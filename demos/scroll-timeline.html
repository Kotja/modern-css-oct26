<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scroll timeline demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #282a36;
        color: #8be9fd;
        font-family: sans-serif;
      }

      .scroll-demo {
        height: 100%;
        overflow-y: scroll;
        padding: 10px;
        box-sizing: border-box;
      }

      .hint {
        margin: 0 0 12px;
        font-size: 14px;
      }

      .scroll-content {
        height: 800px;
        position: relative;
      }

      .animated-box {
        width: 100px;
        height: 100px;
        background: #ff79c6;
        border-radius: 8px;
        position: sticky;
        top: 50px;
        animation: rotateBox linear forwards;
        animation-timeline: scroll(nearest);
      }

      @keyframes rotateBox {
        to {
          transform: rotate(360deg) scale(1.5);
          background: #50fa7b;
        }
      }
    </style>
  </head>
  <body>
    <div class="scroll-demo">
      <p class="hint">Scroll down inside this box</p>
      <div class="scroll-content">
        <div class="animated-box"></div>
      </div>
    </div>
  </body>
</html>
